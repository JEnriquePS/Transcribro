appId: io.transcribro.app
productName: Transcribro
copyright: "Copyright © 2026 Transcribro"

directories:
  buildResources: resources
  output: dist-app

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "!**/*.map"
  - "!**/*.ts"

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extraResources:
    - from: "resources/bin/darwin-${arch}"
      to: "bin"
      filter:
        - "**"

dmg:
  title: "Transcribro ${version}"
  artifactName: "Transcribro-${version}-${arch}.dmg"
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  extraResources:
    - from: "resources/bin/win32-${arch}"
      to: "bin"
      filter:
        - "**"

nsis:
  artifactName: "Transcribro-${version}-Setup.exe"
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Utility
  extraResources:
    - from: "resources/bin/linux-${arch}"
      to: "bin"
      filter:
        - "**"

deb:
  artifactName: "Transcribro-${version}-${arch}.deb"
  maintainer: "jenriqueps <jenrique.ps@gmail.com>"
